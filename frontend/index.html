<!DOCTYPE html>
<html lang="de-AT">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gehalt</title>
  <link rel="stylesheet" href="/styles.css" />
  <script>
    // Set the theme before first paint to avoid a flash of the wrong colours.
    (function () {
      var saved = null;
      try { saved = localStorage.getItem("gehalt-theme"); } catch (e) { /* private mode */ }
      var theme = saved ||
        (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <h1>Gehalt</h1>
      <span class="subtitle">Brutto / Netto Übersicht</span>
    </div>
    <div class="topbar-right">
      <span id="saveStatus" class="save-status" data-state="idle">Bereit</span>
      <button id="exportBtn" class="btn" type="button" title="Alle Daten als JSON-Datei herunterladen">Export</button>
      <button id="importBtn" class="btn" type="button" title="Daten aus einer JSON-Datei laden (ersetzt alles)">Import</button>
      <input id="importFile" type="file" accept=".json,application/json" hidden />
      <button id="themeToggle" class="btn btn-icon-toggle" type="button" title="Hell / Dunkel umschalten"></button>
      <button id="addYearBtn" class="btn btn-primary" type="button">+ Jahr hinzufügen</button>
    </div>
  </header>

  <main>
    <div class="table-wrap">
      <table id="grid">
        <thead id="gridHead"></thead>
        <tbody id="gridBody"></tbody>
      </table>
    </div>
    <p id="emptyHint" class="empty-hint" hidden>Noch keine Daten. Füge ein Jahr hinzu.</p>
  </main>

  <div id="toast" class="toast" hidden></div>

  <script src="/app.js"></script>
</body>
</html>
