services:
  gehalt:
    # Pulls the published image; falls back to building from this folder
    # (`docker compose up --build` always builds locally).
    image: ghcr.io/n0ne117/gehalt:latest
    build: .
    container_name: gehalt
    ports:
      - "9605:8000"
    volumes:
      # Persistent, human-readable data store: ./data/gehalt.json on the host.
      - ./data:/data
    environment:
      - DATA_FILE=/data/gehalt.json
    restart: unless-stopped
